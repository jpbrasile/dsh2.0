# GENERE par harness/modeles.py --emettre -- ne pas editer a la main (relire le diff git).
# Base : modeles.sqlite (422 modeles au dernier rafraichissement ; la date est dans la table rafraichissements).
# Tier OPEN seulement : gratuits et stealth. Jamais de route PRIVATE ici, par construction
# (tier calcule du catalogue, voir modeles.py). [probation] = < 3 verts sous `minimal`.

providers:

  openrouter-auto:
    name: OpenRouter (auto, OPEN only -- emis par modeles.py)
    apiKeyEnv: OPENROUTER_API_KEY
    api: openai-completions
    baseURL: https://openrouter.ai/api/v1
    defaultContextWindow: 65536
    models:
      - id: stealth/ox-alpha
        name: Ox Alpha [OPEN, stealth]
        contextWindow: 65536
        reasoningEfforts: { "off": , low: low, medium: medium, high: high }
      - id: dots-studio/dots-3-note-preview:free
        name: Dots Studio  Dots3-Note Preview (free) [probation, OPEN, free]
        contextWindow: 65536
        reasoningEfforts: { "off": , low: low, medium: medium, high: high }
      - id: liquid/lfm-2.5-2.6b:free
        name: LiquidAI  LFM2.5-2.6B (free) [probation, OPEN, free]
        contextWindow: 65536
        reasoningEfforts: { "off": , low: low, medium: medium, high: high }
      - id: nvidia/nemotron-3.5-lightning:free
        name: NVIDIA  Nemotron 3.5 Lightning (free) [probation, OPEN, free]
        contextWindow: 65536
        reasoningEfforts: { "off": , low: low, medium: medium, high: high }
      - id: thinkingmachines/inkling-small:free
        name: Thinking Machines  Inkling Small (free) [probation, OPEN, free]
        contextWindow: 65536
        reasoningEfforts: { "off": , low: low, medium: medium, high: high }
