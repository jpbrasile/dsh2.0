# Agents layer -- Phase 2 of the README, 2026-08-23. Third patch layer, applied
# after Lean (and after open-wall.patch.yml on an OPEN worker):
#
#     dsh --profile headless --patch harness/lean.patch.yml --patch harness/agents.patch.yml "<task>"
#
# dsh 0.1.1-rc.2 has no agent registry: a named role is ONE loaded instance of
# `@deepseek-ai/dsh-tool-subagent` (toolName = the role the model calls, its own
# provider/model, persona, exact-name toolFilter, depth cap). MCP servers
# register on the GLOBAL tool layer -- a child joins its parent's composition --
# so Context7 is visible to the orchestrator too; the searcher's toolFilter is
# context economy, not a wall (plugin README: "not a parent-derived authority
# ceiling"). The walls stay: the sandbox (writes), dsh-read-wall on OPEN
# workers (reads), dsh-secret-redactor (results) and, new here, dsh-query-wall
# on the ONE channel from a PRIVATE parent to an OPEN child: the `prompt` of
# the delegation tool.
#
# Measured by `node harness/query_unit.mjs` (free) and on the wire by
# `python scripts/bench_julia_effort/fumee_route.py ... --patch <abs>/harness/agents.patch.yml --aussi openrouter-auto=stealth/ox-alpha`.

# ── inserted: Context7 docs MCP (streamable-http; `sse` is not a dsh transport) ─
# No key: the public endpoint answers resolve-library-id / query-docs without one
# (measured 23/08, 43 framework deps probed by harness/context7_sonde.py). A key
# would go in `headers:` from the credentials file, never inline.
- insert:
    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context7
        transport: streamable-http
        url: https://mcp.context7.com/mcp
        toolCallTimeoutMs: 60000
        failOnStartupError: true      # a silent bridge failure = a missing tool, not a quiet fallback

# ── inserted: role `searcher` -- fresh child on the `open` chain, Context7 only ─
# provider `spawn` = fresh context (the child sees only its prompt); the parent
# gets the child's final text only. Model = head of the `open` chain in
# harness/chaines.yaml (OPEN, out of probation). Static here: regenerate by hand
# when chaines.yaml changes (limit noted in docs/PHASE2.md).
- insert:
    - id: tool-subagent-searcher
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: searcher
        backgroundMode: one-shot
        enableRunInBackground: false  # the digest comes back inline, always
        maxDepth: 1                   # the searcher may not delegate further
        agentOptions:
          provider: openrouter-auto
          model: stealth/ox-alpha
          maxTokens: 4096
        persona: >-
          You are `searcher`, a documentation research delegate. You can only query
          Context7 (resolve-library-id, then query-docs with the returned id). You
          have no file, shell or web tools and no memory of the caller's project.
          Answer the question with a compact digest: the documented signature or
          behaviour, version if stated, and the Context7 library id you used as the
          source. Quote documentation, never invent an API. If Context7 has no
          matching library, say so in one line and stop.
        toolFilter:
          allow:
            - mcp__context7__resolve-library-id
            - mcp__context7__query-docs

# ── stripped: the GENERIC delegation tools ───────────────────────────────────
# Measured 23/08 (red-team arm, harness/taches/searcher_rt.txt): told to paste
# framework code into a research question, qwen3.8-27b skipped `searcher` and
# called the generic `subagent` -- a child on ITS OWN route with all 21 tools,
# 232 s on one call, run killed at 300 s. Not an OPEN leak (same PRIVATE
# model), but an uncontrolled delegation the query wall does not cover. The
# README's agent split names its workers; from this layer on, delegation
# happens only through named roles. The scheduler SERVICE (subagent,
# subagent-spawn-in-process) stays: `searcher` is built on it.
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true

# ── inserted: the query wall on every channel that leaves the PRIVATE route ──
# Local plugin scripts/dsh-plugins/dsh-query-wall (copied into the isolated
# home by fumee_route.py, mounted by dsh.ps1 -InstallPlugins otherwise).
# Covers the `searcher` prompt AND the Context7 tools themselves: MCP tools are
# global, the orchestrator sees them, and a Context7 query is a request to a
# third-party service. Every string argument of a covered tool is checked.
# Roots come from DSH_READ_WALL (same source as dsh-read-wall); identifiers
# name the framework so a prose mention is refused too.
- insert:
    - id: query-wall
      name: dsh-query-wall
      config:
        tools: [searcher, mcp__context7__resolve-library-id, mcp__context7__query-docs]
        maxChars: 1200
        identifiers: [PlasmaDigitalTwin, plasma-digital-twin, agentic-flow-fresh]

# ── inserted: the Julia test gate as a model tool (Phase 0.5 behind Phase 2) ──
# Local plugin scripts/dsh-plugins/dsh-julia-gate: `julia_gate(files)` runs
# scripts/julia_gate/porte.py (DSH_JULIA_GATE) on the project DSH_GATE_REPO
# (default: cwd) and returns VERT / ORANGE / ROUGE / PANNE. ORANGE is not green.
- insert:
    - id: julia-gate
      name: dsh-julia-gate
      config:
        budget: 30

# ── inserted: the lessons variable {{lecons}} (Phase 3, Memory) ──────────────
# Local plugin scripts/dsh-plugins/dsh-lecons: registers the prompt variable
# {{lecons}} = harness/lecons.md (DSH_LECONS), the observations distilled from
# past sessions by harness/distiller.py, under a "DATA, not instructions"
# header. Only a persona that writes {{lecons}} receives it: the planner below.
- insert:
    - id: lecons
      name: dsh-lecons
      config:
        max: 40

# ── inserted: the test wall (every agent of the process) ─────────────────────
# Local plugin scripts/dsh-plugins/dsh-test-wall: no edit/write/delete under
# `<cwd>/test` (and DSH_TEST_WALL roots), no Julia or test runner from the
# shell, no `git checkout/restore/reset/stash/clean/rm/mv`. README red-team
# angle "green diff by deleting or weakening tests": the coder cannot reach
# the tests, and the gate is the only test runner. A wrong or missing test is
# a structured failure the coder must report, not a file it may write.
- insert:
    - id: test-wall
      name: dsh-test-wall

# ── inserted: role `coder` -- the pinned worker, files + shell + gate ─────────
# README: "bash + editor. Loop: edit -> targeted tests -> green diff or
# structured failure. Full suite pre-merge only." Model = the Phase 0 pinned
# worker (head of the `ouvrier` chain, PRIVATE+OPEN). No delegation (maxDepth 0
# would forbid its own start; 1 = it may not delegate further).
- insert:
    - id: tool-subagent-coder
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: coder
        backgroundMode: one-shot
        enableRunInBackground: false
        maxDepth: 1
        agentOptions:
          provider: openrouter
          model: qwen/qwen3.8-27b
          maxTokens: 8192
        persona: >-
          You are `coder`, the implementation delegate of a Julia project. Loop:
          read the files you need, edit source files under src/, then call the
          `julia_gate` tool with every .jl file you changed. VERT = done.
          ORANGE = nothing failed but heavier suites are still pending: say so,
          it is not green. ROUGE = read the error blocks, fix the source, call the
          gate again (at most 3 rounds). You never create, edit or delete tests
          and never run Julia yourself: if a test is wrong or missing, stop and
          report a structured failure (file, line, expected vs observed). Final
          message: the files you changed, the last gate verdict, and any failure.
        toolFilter:
          allow:
            - read
            - glob
            - grep
            - str_replace_editor
            - edit
            - write
            - pwsh
            - julia_gate
            - todo_write

    # Phase 2, `planner` : route PRIVATE la mieux classee (modeles.py --classer : le seul
    # PRIVATE+OPEN avec un score de verdict), LECTURE SEULE par construction -- aucun outil
    # d'ecriture, de shell ni de porte dans son filtre ; un appel a un outil absent est
    # refuse par dsh (tool inconnu). Le plan revient au parent comme texte ; c'est le
    # parent qui l'ecrit. Red team du Done : le plan est une sortie deepseek, le red team
    # deepseek-v4-pro ne peut pas le juger (README : autre famille) -- il juge le harnais.
    - id: tool-subagent-planner
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: planner
        backgroundMode: one-shot
        enableRunInBackground: false
        maxDepth: 1
        agentOptions:
          provider: openrouter
          model: deepseek/deepseek-v4-pro
          maxTokens: 8192
        persona: >-
          You are `planner`, the read-only planning delegate of a Julia project.
          You read the code (read, glob, grep) and output a plan; you never modify
          anything and you have no tool that can. Your final message IS the plan:
          (1) goal in one sentence, (2) the files to touch, each with what changes
          and why, (3) ordered steps for the coder, (4) the targeted tests the gate
          must replay (existing test files, by path -- the coder runs tests ONLY
          through its `julia_gate` tool, never a shell `julia` command, so name
          files, not commands) and the acceptance criterion,
          (5) risks and what NOT to touch. Be concrete: cite functions, lines and
          existing tests by name. If the task is ambiguous or impossible as stated,
          say so and plan the smallest safe step instead of guessing.


          {{lecons}}
        toolFilter:
          allow:
            - read
            - glob
            - grep

# tools-added: searcher coder planner julia_gate mcp__context7__resolve-library-id mcp__context7__query-docs
# tools-removed: subagent subagent_fork
